<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="920" viewBox="0 0 560 920">

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#222"/>
    </marker>
    <style>
      .box { fill:#fff; stroke:#222; stroke-width:1.5; }
      .term { fill:#d6ebf9; stroke:#222; stroke-width:1.5; }
      .dia { fill:#fff4d6; stroke:#222; stroke-width:1.5; }
      .tx { font:14px Arial,sans-serif; fill:#222; }
      .hd { font:bold 16px Arial,sans-serif; fill:#222; }
      .lb { font:bold 12px Arial,sans-serif; fill:#444; }
      .ln { fill:none; stroke:#222; stroke-width:1.5; marker-end:url(#arr); }
    </style>
  </defs>

<text x="280" y="32" text-anchor="middle" class="hd">Опт. 1: устранение временной переменной</text>
<ellipse cx="280" cy="70" rx="55" ry="22" class="term"/>
<text x="280" y="75" text-anchor="middle" class="tx">Начало</text>
<path d="M 280 92 L 280 108" class="ln"/>
<rect x="145" y="95" width="270" height="40" rx="4" class="box"/>
<text x="280" y="120" text-anchor="middle" class="tx">i := 0,  out := пустой список</text>
<path d="M 280 135 L 280 163" class="ln"/>
<polygon points="280,137 375,175 280,213 185,175" class="dia"/>
<text x="280" y="180" text-anchor="middle" class="tx">i &lt; len(IR)?</text>
<text x="165" y="171" class="lb">нет</text>
<path d="M 185 175 L 50 175" class="ln"/>
<path d="M 50 175 L 50 860" class="ln"/>
<path d="M 50 860 L 170 860" class="ln"/>
<text x="388" y="171" class="lb">да</text>
<path d="M 280 213 L 280 243" class="ln"/>
<polygon points="280,183 395,225 280,267 165,225" class="dia"/>
<text x="280" y="219" text-anchor="middle" class="tx">LOAD_CONST t=c</text>
<text x="280" y="237" text-anchor="middle" class="tx">и STORE x=t ?</text>
<text x="150" y="221" class="lb">нет</text>
<path d="M 165 225 L 155 225" class="ln"/>
<path d="M 155 225 L 155 600" class="ln"/>
<rect x="68" y="578" width="175" height="44" rx="4" class="box"/>
<text x="155" y="596" text-anchor="middle" class="tx">out += IR[i]</text>
<text x="155" y="614" text-anchor="middle" class="tx">i := i + 1</text>
<path d="M 243 600 L 500 600" class="ln"/>
<path d="M 500 622 L 500 175" class="ln"/>
<path d="M 500 175 L 375 175" class="ln"/>
<text x="508" y="380" class="lb">↑ цикл</text>
<text x="408" y="596" class="lb">да</text>
<path d="M 280 642 L 280 672" class="ln"/>
<rect x="160" y="292" width="240" height="36" rx="4" class="box"/>
<text x="280" y="315" text-anchor="middle" class="tx">out += STORE x = c</text>
<path d="M 280 328 L 280 658" class="ln"/>
<rect x="205" y="359" width="150" height="32" rx="4" class="box"/>
<text x="280" y="380" text-anchor="middle" class="tx">i := i + 2</text>
<path d="M 280 391 L 280 783" class="ln"/>
<polygon points="280,413 358,445 280,477 202,445" class="dia"/>
<text x="280" y="450" text-anchor="middle" class="tx">след. SET_TYPE?</text>
<text x="185" y="441" class="lb">нет</text>
<path d="M 202 445 L 500 445" class="ln"/>
<path d="M 500 445 L 500 175" class="ln"/>
<path d="M 500 175 L 375 175" class="ln"/>
<text x="375" y="441" class="lb">да</text>
<path d="M 280 477 L 280 943" class="ln"/>
<rect x="155" y="507" width="250" height="36" rx="4" class="box"/>
<text x="280" y="530" text-anchor="middle" class="tx">out += SET_TYPE,  i := i + 1</text>
<path d="M 280 543 L 500 543" class="ln"/>
<path d="M 500 543 L 500 175" class="ln"/>
<path d="M 500 175 L 375 175" class="ln"/>
<ellipse cx="280" cy="860" rx="115" ry="24" class="term"/>
<text x="280" y="865" text-anchor="middle" class="tx">Переиндексация, конец</text>
</svg>
